<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مركز الأقصى القرآني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ink:#0d302c;
    --teal-950:#092623;
    --teal-800:#0f4640;
    --teal-700:#1a6a5f;
    --teal-500:#2fa89b;
    --gold:#e9c250;
    --gold-light:#f3da84;
    --parchment:#f7f4ea;
    --parchment-2:#efe7d2;
    --mint:#e7f5f4;
    --red:#a8412f;
    --line:#d8d3ae;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--parchment);
    color:var(--ink);
    min-height:100vh;
  }
  #app{min-height:100vh;}
  ::selection{background:var(--gold-light);}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(201,162,75,.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(23,90,81,.25), transparent 45%),
      var(--teal-950);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:420px;
    background:var(--parchment);
    border:1px solid var(--line);
    border-radius:18px;
    padding:36px 30px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:"";position:absolute;inset:0;
    border:10px solid transparent;
    background:
      linear-gradient(var(--parchment),var(--parchment)) padding-box,
      linear-gradient(135deg,var(--gold),var(--teal-700) 60%,var(--gold)) border-box;
    border-radius:18px;
    pointer-events:none;
    z-index:-1;
  }
  .login-card > *{ position:relative; z-index:1; }
  .brand{text-align:center;margin-bottom:22px;}
  .brand .mark{
    width:64px;height:64px;margin:0 auto 10px;
    border-radius:50%;
    overflow:hidden;
    background:var(--parchment);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px var(--parchment), 0 0 0 5px var(--gold), 0 6px 18px rgba(9,38,35,.35);
  }
  .brand .mark img{width:100%;height:100%;object-fit:cover;}
  .brand h1{font-size:22px;margin:0;color:var(--teal-800);font-weight:900;}
  .brand p{margin:4px 0 0;font-size:12.5px;color:#7a6f4d;letter-spacing:.5px;}

  .tabs{display:flex;background:var(--parchment-2);border-radius:12px;padding:4px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:10px 8px;border:none;background:transparent;border-radius:9px;font-family:inherit;font-weight:700;font-size:14px;color:#7a6f4d;cursor:pointer;transition:.2s;}
  .tab-btn.active{background:var(--teal-800);color:var(--parchment);box-shadow:0 4px 10px rgba(15,46,44,.25);}

  label{display:block;font-size:12.5px;font-weight:700;color:var(--teal-800);margin-bottom:5px;}
  .field{margin-bottom:14px;}
  input[type=text],input[type=password],input[type=email],input[type=date],select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14px;background:#fffdf7;color:var(--ink);
    outline:none;transition:.15s;
  }
  input:focus,select:focus{border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(31,143,125,.15);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 18px;border-radius:10px;border:none;cursor:pointer;
    font-family:inherit;font-weight:700;font-size:14px;transition:.15s;
  }
  .btn-primary{background:var(--teal-800);color:var(--parchment);width:100%;}
  .btn-primary:hover{background:var(--teal-700);}
  .btn-gold{background:var(--gold);color:var(--teal-950);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--teal-800);}
  .btn-ghost:hover{background:var(--parchment-2);}
  .btn-danger{background:transparent;border:1.5px solid var(--red);color:var(--red);}
  .btn-danger:hover{background:rgba(168,65,47,.08);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
  .error-msg{background:rgba(168,65,47,.1);border:1px solid rgba(168,65,47,.35);color:var(--red);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:14px;}
  .pwd-wrap{position:relative;}
  .pwd-wrap input{padding-left:40px;}
  .pwd-toggle{position:absolute;left:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:6px;color:#9a8f6d;line-height:1;}
  .pwd-toggle:hover{color:var(--teal-700);}
  .hint{font-size:11.5px;color:#9a8f6d;margin-top:14px;text-align:center;line-height:1.7;}

  /* ---------- App shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--teal-950);color:var(--parchment);
    padding:22px 14px;display:flex;flex-direction:column;
  }
  .sidebar .brand2{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px;}
  .sidebar .brand2 .mark{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--parchment);box-shadow:0 0 0 2px var(--gold);}
  .sidebar .brand2 .mark img{width:100%;height:100%;object-fit:cover;}
  .sidebar .brand2 div b{display:block;font-size:14.5px;}
  .sidebar .brand2 div span{display:block;font-size:11px;color:var(--gold-light);}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;
    font-size:13.5px;font-weight:700;color:#d9d3c0;margin-bottom:4px;transition:.15s;border:none;background:transparent;width:100%;text-align:right;font-family:inherit;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--teal-700);color:#fff;}
  .nav-item .ic{font-size:16px;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
  .logout-btn{width:100%;background:transparent;border:1.5px solid rgba(255,255,255,.2);color:#e8e2cf;padding:9px;border-radius:9px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;}
  .logout-btn:hover{background:rgba(255,255,255,.08);}

  .main{flex:1;padding:28px 32px;max-width:1200px;}
  .page-head{margin-bottom:22px;}
  .page-head h2{margin:0 0 4px;font-size:22px;color:var(--teal-800);font-weight:900;}
  .page-head p{margin:0;color:#8a7f5c;font-size:13.5px;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;}
  .stat-card .label{font-size:12.5px;color:#8a7f5c;font-weight:700;margin-bottom:8px;}
  .stat-card .value{font-size:26px;font-weight:900;color:var(--teal-800);}
  .stat-card .sub{font-size:11.5px;color:#a89a6b;margin-top:4px;}
  .stat-card.accent{background:linear-gradient(135deg,var(--teal-800),var(--teal-700));color:#fff;}
  .stat-card.accent .label{color:var(--gold-light);}
  .stat-card.accent .value{color:#fff;}
  .stat-card.accent .sub{color:#cfe6df;}
  .stat-card.accent .progress-bar{background:rgba(255,255,255,.25);}
  .stat-card.accent .progress-bar-fill{background:var(--gold-light);}

  .card{background:#fffdf8;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:15.5px;color:var(--teal-800);font-weight:800;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .row .field{flex:1;min-width:150px;margin-bottom:0;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:right;padding:10px 8px;color:#8a7f5c;font-size:12px;border-bottom:2px solid var(--line);}
  td{padding:10px 8px;border-bottom:1px solid #ece3cb;}
  tr:last-child td{border-bottom:none;}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill-green{background:rgba(31,143,125,.15);color:var(--teal-700);}
  .pill-red{background:rgba(168,65,47,.12);color:var(--red);}
  .pill-gray{background:#eee7d2;color:#8a7f5c;}
  .pill-gold{background:rgba(201,162,75,.2);color:#8a6d1f;}

  .att-radio{display:flex;gap:6px;}
  .att-opt{flex:1;text-align:center;padding:7px 4px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;font-size:11.5px;font-weight:700;color:#8a7f5c;user-select:none;}
  .att-opt.sel-present{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}
  .att-opt.sel-excused{background:#eee7d2;color:#6b6142;border-color:#d9cba3;}
  .att-opt.sel-unexcused{background:var(--red);color:#fff;border-color:var(--red);}

  .quran-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;max-height:460px;overflow-y:auto;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fffef9;}
  .qpage{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);
    background:#fff;color:#a89a6b;transition:.1s;
  }
  .qpage:hover{transform:scale(1.08);}
  .qpage.g3{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}
  .qpage.g2{background:#4fa896;color:#fff;border-color:#4fa896;}
  .qpage.g1{background:var(--gold);color:#4a3a06;border-color:var(--gold);}
  .qpage.g0{background:#8a7d54;color:#fff;border-color:#8a7d54;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#8a7f5c;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}

  .group-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fffdf8;}
  .group-card .ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .group-card .gname{font-weight:800;color:var(--teal-800);font-size:15px;}
  .rank-badge{width:28px;height:28px;border-radius:50%;background:var(--parchment-2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--teal-800);}
  .rank-badge.first{background:var(--gold);color:#4a3a06;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--parchment-2);padding:4px 10px;border-radius:999px;font-size:12px;margin:2px;color:var(--teal-800);}
  .chip button{border:none;background:none;color:var(--red);cursor:pointer;font-weight:900;font-size:13px;padding:0;}
  .weekday-picker{display:flex;gap:6px;flex-wrap:wrap;}
  .wd{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:700;color:#8a7f5c;}
  .wd.sel{background:var(--teal-700);color:#fff;border-color:var(--teal-700);}
  .days-scroll{display:flex;gap:8px;flex-wrap:wrap;max-height:220px;overflow-y:auto;padding:4px 2px;}
  .day-chip{position:relative;padding:9px 14px 9px 24px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:700;color:#6b6142;white-space:nowrap;background:#fffdf8;transition:.15s;}
  .day-chip:hover{border-color:var(--teal-500);}
  .day-chip::before{content:"";position:absolute;top:50%;left:8px;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--line);}
  .day-chip.done::before{background:var(--teal-500);}
  .day-chip.partial::before{background:var(--gold);}
  .day-chip.sel{background:var(--teal-800);color:#fff;border-color:var(--teal-800);}
  .day-chip.sel::before{background:#fff;}
  .empty{text-align:center;padding:30px;color:#a89a6b;font-size:13.5px;}
  .progress-bar{width:100%;height:9px;border-radius:999px;background:#eee7d2;overflow:hidden;margin-top:8px;}
  .progress-bar-fill{height:100%;border-radius:999px;background:var(--teal-500);transition:width .3s ease;}
  .progress-bar-fill.low{background:var(--red);}
  .progress-bar-fill.mid{background:var(--gold);}
  .progress-inline{display:flex;align-items:center;gap:8px;min-width:140px;}
  .progress-inline .progress-bar{flex:1;margin-top:0;}
  .progress-inline .progress-pct{font-size:12px;font-weight:800;color:var(--teal-800);white-space:nowrap;}
  @media (max-width:800px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;}
    .sidebar .brand2{display:none;}
    .sidebar-foot{display:none;}
    .nav-item{white-space:nowrap;width:auto;}
    .main{padding:18px;}
  }
</style>
</head>

/* ---------- points/stats helpers ---------- */
function attendanceStats(studentId){
  const att = data.attendance[studentId] || {};
  let present=0, excused=0, unexcused=0, pts=0;
  Object.values(att).forEach(v=>{
    if(v==='present'){present++; pts+=2;}
    else if(v==='excused'){excused++;}
    else if(v==='unexcused'){unexcused++; pts-=1;}
  });
  const total = present+excused+unexcused;
  const pct = total? Math.round((present/total)*100) : 0;
  return {present,excused,unexcused,total,pts,pct};
}
function recitationStats(studentId){
  const rec = data.recitation[studentId] || {};
  let pts=0, completed=0;
  Object.values(rec).forEach(g=>{ if(g && GRADES.hasOwnProperty(g)){ pts+=GRADES[g]; completed++; } });
  return {pts, completed};
}
const NEW_MEMORIZATION_GRADES = ['ممتاز','جيد جدا','جيد'];
function newMemorizationCount(studentId){
  const rec = data.recitation[studentId] || {};
  let count=0;
  Object.values(rec).forEach(g=>{ if(NEW_MEMORIZATION_GRADES.includes(g)) count++; });
  return count;
}
function studentPoints(studentId){
  return attendanceStats(studentId).pts + recitationStats(studentId).pts;
}
function groupPoints(groupId){
  const g = data.groups.find(g=>g.id===groupId);
  const base = data.students.filter(s=>s.groupId===groupId).reduce((sum,s)=>sum+studentPoints(s.id),0);
  return base + (g && g.bonusPoints ? g.bonusPoints : 0);
}
function groupRanking(){
  return data.groups.map(g=>({...g, pts:groupPoints(g.id)})).sort((a,b)=>b.pts-a.pts);
}
function toDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return toDateStr(new Date()); }
function competitionCountdown(){
  const c = data.config;
  if(!c.competitionEnd) return {state:'none'};
  const today = todayStr();
  if(c.competitionStart && today < c.competitionStart) return {state:'not-started', start:c.competitionStart};
  if(today > c.competitionEnd) return {state:'ended'};
  const diff = Math.ceil((new Date(c.competitionEnd+'T00:00:00') - new Date(today+'T00:00:00'))/86400000);
  return {state:'running', days:diff};
}
function isValidAttendanceDate(dateStr){
  if(!dateStr) return false;
  const c = data.config;
  if(c.classStart && dateStr < c.classStart) return false;
  if(c.classEnd && dateStr > c.classEnd) return false;
  const day = new Date(dateStr+'T00:00:00').getDay();
  return c.attendanceDays.includes(day);
}
function classAttendanceDates(){
  const c = data.config;
  if(!c.classStart || !c.classEnd) return [];
  const dates = [];
  let cur = new Date(c.classStart+'T00:00:00');
  const end = new Date(c.classEnd+'T00:00:00');
  let guard = 0;
  while(cur <= end && guard < 2000){
    guard++;
    if(c.attendanceDays.includes(cur.getDay())) dates.push(toDateStr(cur));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}
function dayChipLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(n=>parseInt(n,10));
  const wd = WEEKDAYS[new Date(dateStr+'T00:00:00').getDay()];
  return `${wd} ${d}/${m}`;
}

/* ---------- backup import (shared) ---------- */
async function importBackupFile(file){
  if(!file) return false;
  if(!confirm('استيراد هذه النسخة سيستبدل كل البيانات الحالية. هل تريد المتابعة؟')) return false;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed!=='object' || !parsed.config || !Array.isArray(parsed.students)){
      alert('ملف غير صالح، تأكد أنه نسخة احتياطية صادرة من هذا النظام');
      return false;
    }
    data = parsed;
    await saveData();
    alert('تم استيراد النسخة الاحتياطية بنجاح، يمكنك الآن تسجيل الدخول');
    session = {role:null, adminIn:false, studentId:null};
    ui.loginError='';
    render();
    return true;
  }catch(e){
    alert('تعذّر قراءة الملف، تأكد أنه بصيغة JSON صحيحة');
    return false;
  }
}
function bindBackupImport(inputId){
  const importInput = document.getElementById(inputId);
  if(importInput) importInput.onchange = async ()=>{
    const file = importInput.files[0];
    await importBackupFile(file);
    importInput.value='';
  };
}

function bindStudents(){
  document.getElementById('ns-add').onclick = async ()=>{
    const name = document.getElementById('ns-name').value.trim();
    const klass = document.getElementById('ns-class').value.trim();
    const pass = document.getElementById('ns-pass').value;
    if(!name || !pass){ alert('الرجاء إدخال اسم الطالب وكلمة المرور'); return; }
    if(data.students.some(s=>s.name===name)){ alert('يوجد طالب بنفس الاسم مسبقًا، الرجاء اختيار اسم مختلف أو إضافة توضيح'); return; }
    data.students.push({id:uid(), name, class:klass, password:pass, groupId:null});
    await saveData(); render();
  };
  document.querySelectorAll('[data-del-student]').forEach(b=>b.onclick=async ()=>{
    if(!confirm('هل تريد حذف هذا الطالب؟')) return;
    const id=b.dataset.delStudent;
    data.students = data.students.filter(s=>s.id!==id);
    delete data.attendance[id]; delete data.recitation[id];
    await saveData(); render();
  });
  document.querySelectorAll('[data-edit-student]').forEach(b=>b.onclick=()=>{
    ui.editStudentId = b.dataset.editStudent; render();
  });
  document.querySelectorAll('[data-cancel-edit]').forEach(b=>b.onclick=()=>{
    ui.editStudentId = null; render();
  });
  document.querySelectorAll('[data-save-student]').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.saveStudent;
    const row = b.closest('tr');
    const name = row.querySelector('.edit-name').value.trim();
    const klass = row.querySelector('.edit-class').value.trim();
    const pass = row.querySelector('.edit-pass').value;
    if(!name || !pass){ alert('الرجاء تعبئة الاسم وكلمة المرور'); return; }
    if(data.students.some(s=>s.name===name && s.id!==id)){ alert('يوجد طالب آخر بنفس الاسم'); return; }
    const s = data.students.find(s=>s.id===id);
    s.name=name; s.class=klass; s.password=pass;
    ui.editStudentId = null;
    await saveData(); render();
  });
}

function bindIncentive(){
  document.getElementById('ng-add').onclick = async ()=>{

    const noteInput = document.querySelector(`.bonus-note[data-group="${gid}"]`);

/* ---------- attendance ---------- */
function pageAttendance(){
  const c = data.config;
  const dates = classAttendanceDates();
  if(!dates.length){
    return `<div class="page-head"><h2>الحضور والغياب</h2><p>حضور = نقطتان، غياب بعذر = صفر، غياب بدون عذر = خصم نقطة</p></div>
    <div class="card"><div class="empty">حدّد تاريخ بداية ونهاية الفصل وأيام الدوام من قسم «الإعدادات» أولًا لتظهر أيام الدوام هون</div></div>`;
  }
  if(!ui.attDate || !dates.includes(ui.attDate)) ui.attDate = dates.includes(todayStr()) ? todayStr() : dates[0];
  if(!ui.attDraft || ui.attDraft._date!==ui.attDate){
    ui.attDraft = {_date: ui.attDate};
    data.students.forEach(s=>{ ui.attDraft[s.id] = (data.attendance[s.id]||{})[ui.attDate] || null; });
  }
  const dayChips = dates.map(d=>{
    const recorded = data.students.length>0 && data.students.every(s=>(data.attendance[s.id]||{})[d]);
    const partial = !recorded && data.students.some(s=>(data.attendance[s.id]||{})[d]);
    return `<div class="day-chip ${d===ui.attDate?'sel':''} ${recorded?'done':''} ${partial?'partial':''}" data-date="${d}">${dayChipLabel(d)}</div>`;
  }).join('');
  return `
  <div class="page-head"><h2>الحضور والغياب</h2><p>حضور = نقطتان، غياب بعذر = صفر، غياب بدون عذر = خصم نقطة</p></div>
  <div class="card">
    <h3>أيام الدوام ضمن فترة الفصل</h3>
    <div class="days-scroll">${dayChips}</div>
    <div class="legend" style="margin-top:10px;">
      <span><i style="background:var(--teal-500);border-radius:50%;"></i> تم تسجيل الجميع</span>
      <span><i style="background:var(--gold);border-radius:50%;"></i> تسجيل جزئي</span>
      <span><i style="background:var(--line);border-radius:50%;"></i> لم يُسجَّل بعد</span>
    </div>
  </div>
  ${!data.students.length ? `<div class="card"><div class="empty">أضف طلابًا أولًا من قسم «الطلاب»</div></div>` : `
  <div class="card">
    <h3>تسجيل يوم: ${dayChipLabel(ui.attDate)}</h3>
    <table><thead><tr><th>الطالب</th><th>نسبة الحضور</th><th>الحالة</th></tr></thead><tbody>
      ${data.students.map(s=>{
        const v = ui.attDraft[s.id];
        const pct = attendanceStats(s.id).pct;
        return `<tr><td>${esc(s.name)}</td><td>${progressBarInlineHtml(pct)}</td><td>
          <div class="att-radio">
            <div class="att-opt ${v==='present'?'sel-present':''}" data-att="${s.id}" data-val="present">حاضر</div>
            <div class="att-opt ${v==='excused'?'sel-excused':''}" data-att="${s.id}" data-val="excused">غياب بعذر</div>
            <div class="att-opt ${v==='unexcused'?'sel-unexcused':''}" data-att="${s.id}" data-val="unexcused">غياب بدون عذر</div>
          </div></td></tr>`;
      }).join('')}
    </tbody></table>
    <div style="margin-top:16px;"><button class="btn btn-primary" id="att-save" style="width:auto;padding-inline:26px;">حفظ حضور هذا اليوم</button></div>
  </div>`}`;
}
function bindAttendance(){
  document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{
    ui.attDate = el.dataset.date; ui.attDraft=null; render();
  });
  document.querySelectorAll('[data-att]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.att, val=el.dataset.val;
    ui.attDraft[id] = (ui.attDraft[id]===val) ? null : val;
    render();
  });
  const saveBtn = document.getElementById('att-save');
  if(saveBtn) saveBtn.onclick = async ()=>{
    Object.entries(ui.attDraft).forEach(([sid,val])=>{
      if(sid==='_date') return;
      if(!data.attendance[sid]) data.attendance[sid]={};
      if(val) data.attendance[sid][ui.attDate]=val; else delete data.attendance[sid][ui.attDate];
    });
    await saveData();
    alert('تم حفظ الحضور بنجاح');
    render();
  };
}

/* ---------- recitation ---------- */
function pageRecitation(){
  if(!data.students.length) return `<div class="page-head"><h2>التسميع</h2></div><div class="card"><div class="empty">أضف طلابًا أولًا من قسم «الطلاب»</div></div>`;
  if(!ui.selectedRecStudent) ui.selectedRecStudent = data.students[0].id;
  if(!ui.recDraft || ui.recDraft._sid !== ui.selectedRecStudent){
    ui.recDraft = Object.assign({_sid: ui.selectedRecStudent}, data.recitation[ui.selectedRecStudent]||{});
  }
  const st = recitationStatsFromDraft(ui.recDraft);
  let cells = '';
  for(let p=1;p<=TOTAL_PAGES;p++){
    const g = ui.recDraft[p];
    const cls = g==='ممتاز'?'g3':g==='جيد جدا'?'g2':g==='جيد'?'g1':g==='مسمع من قبل'?'g0':'';
    cells += `<div class="qpage ${cls}" data-page="${p}" title="صفحة ${p}${g? ' — '+g:''}">${p}</div>`;
  }
  return `
  <div class="page-head"><h2>التسميع</h2><p>604 صفحة — اضغط على الصفحة لتدوير التقييم: ممتاز ← جيد جدًا ← جيد ← مسمّع من قبل ← بدون</p></div>
  <div class="card">
    <div class="row">
      <div class="field"><label>اختر الطالب</label>
        <select id="rec-student">${data.students.map(s=>`<option value="${s.id}" ${s.id===ui.selectedRecStudent?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      </div>
    </div>
  </div>
  <div class="grid-cards">
    <div class="stat-card"><div class="label">صفحات مُنجزة</div><div class="value">${st.completed}/${TOTAL_PAGES}</div></div>
    <div class="stat-card accent"><div class="label">نقاط التسميع</div><div class="value">${st.pts}</div></div>
  </div>
  <div class="card">
    <div class="quran-grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--teal-700)"></i> ممتاز (3)</span>
      <span><i style="background:#4fa896"></i> جيد جدًا (2)</span>
      <span><i style="background:var(--gold)"></i> جيد (1)</span>
      <span><i style="background:#8a7d54"></i> مسمّع من قبل (0)</span>
      <span><i style="background:#fff;border:1.5px solid var(--line)"></i> لم يُسمّع بعد</span>
    </div>
    <div style="margin-top:16px;"><button class="btn btn-primary" id="rec-save" style="width:auto;padding-inline:26px;">حفظ تقدم التسميع</button></div>
  </div>`;
}
function recitationStatsFromDraft(draft){
  let pts=0, completed=0;
  for(const k in draft){ if(k==='_sid') continue; const g=draft[k]; if(g && GRADES.hasOwnProperty(g)){ pts+=GRADES[g]; completed++; } }
  return {pts, completed};
}
function bindRecitation(){
  const sel = document.getElementById('rec-student');
  if(sel) sel.onchange = ()=>{ ui.selectedRecStudent = sel.value; ui.recDraft=null; render(); };
  document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{
    const p = el.dataset.page;
    const cur = ui.recDraft[p];
    const idx = GRADE_LIST.indexOf(cur);
    const next = idx===-1 ? GRADE_LIST[0] : (idx+1<GRADE_LIST.length ? GRADE_LIST[idx+1] : null);
    if(next) ui.recDraft[p]=next; else delete ui.recDraft[p];
    const grid = document.querySelector('.quran-grid');
    const gridScroll = grid ? grid.scrollTop : 0;
    const winScroll = window.scrollY;
    render();
    const newGrid = document.querySelector('.quran-grid');
    if(newGrid) newGrid.scrollTop = gridScroll;
    window.scrollTo(0, winScroll);
  });
  const saveBtn = document.getElementById('rec-save');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const sid = ui.selectedRecStudent;
    const clean = {}; Object.entries(ui.recDraft).forEach(([k,v])=>{ if(k!=='_sid') clean[k]=v; });
    data.recitation[sid] = clean;
    await saveData();
    alert('تم حفظ تقدم التسميع');
    render();
  };
}

/* ---------- settings ---------- */
function pageSettings(){
  const c = data.config;
  return `

  <div class="card">

      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="set-email" value="${esc(c.adminEmail)}"></div>
      <div class="field"><label>كلمة المرور</label><div class="pwd-wrap"><input type="password" id="set-pass" value="${esc(c.adminPassword)}"><button type="button" class="pwd-toggle" data-target="set-pass">👁</button></div></div>
    </div>
  </div>
  <div class="card">
    <h3>فترة الفصل الدراسي</h3>
    <div class="row">
      <div class="field"><label>تاريخ البداية</label><input type="date" id="set-cs" value="${c.classStart}"></div>
      <div class="field"><label>تاريخ النهاية</label><input type="date" id="set-ce" value="${c.classEnd}"></div>
    </div>
  </div>
  <div class="card">
    <h3>فترة المنافسة (الحافز)</h3>
    <div class="row">
      <div class="field"><label>تاريخ البداية</label><input type="date" id="set-ms" value="${c.competitionStart}"></div>
      <div class="field"><label>تاريخ النهاية</label><input type="date" id="set-me" value="${c.competitionEnd}"></div>
    </div>
  </div>
  <div class="card">
    <h3>أيام الدوام</h3>
    <div class="weekday-picker">${WEEKDAYS.map((w,i)=>`<div class="wd ${c.attendanceDays.includes(i)?'sel':''}" data-day="${i}">${w}</div>`).join('')}</div>
  </div>
  <button class="btn btn-primary" id="set-save" style="width:auto;padding-inline:26px;">حفظ الإعدادات</button>
  <div class="card" style="margin-top:20px;">
    <h3>نسخة احتياطية من البيانات</h3>
    <p class="hint" style="text-align:right;margin:0 0 14px;">هاي البيانات ما بيشوفها إلا حساب المشرف. صدّرها بشكل دوري كملف JSON على جهازك كنسخة احتياطية، وتقدر ترجّعها لاحقًا لو احتجت.</p>
    <div class="row">
      <button class="btn btn-gold btn-sm" id="export-btn">⬇ تصدير نسخة احتياطية (JSON)</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;">⬆ استيراد نسخة احتياطية<input type="file" id="import-file" accept="application/json" style="display:none;"></label>
    </div>
  </div>`;
}
function bindSettings(){
  bindPwdToggles();
  document.querySelectorAll('[data-day]').forEach(el=>el.onclick=async ()=>{
    const d = parseInt(el.dataset.day);
    const arr = data.config.attendanceDays;
    const i = arr.indexOf(d);
    if(i>-1) arr.splice(i,1); else arr.push(d);
    await saveData();
    render();
  });
  document.getElementById('set-save').onclick = async ()=>{
    data.config.adminEmail = document.getElementById('set-email').value.trim();
    data.config.adminPassword = document.getElementById('set-pass').value;
    data.config.classStart = document.getElementById('set-cs').value;
    data.config.classEnd = document.getElementById('set-ce').value;
    data.config.competitionStart = document.getElementById('set-ms').value;
    data.config.competitionEnd = document.getElementById('set-me').value;
    await saveData();
    alert('تم حفظ الإعدادات');
    render();
  };
  document.getElementById('export-btn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `منارة-الحفظ-نسخة-احتياطية-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  bindBackupImport('import-file');
}

/* ---------- student shell ---------- */
const STUDENT_NAV = [
  {k:'overview', ic:'◈', label:'إنجازاتي'},
  {k:'hifzi', ic:'◫', label:'حفظي'},
  {k:'incentive', ic:'🏆', label:'الحافز'},
  {k:'attendance', ic:'🗓', label:'الحضور والغياب'},
];
function studentShell(){
  const s = data.students.find(s=>s.id===session.studentId);
  if(!s) return `<div class="empty">تعذر إيجاد بيانات الطالب</div>`;
  const pages = { overview: pageStudentOverview, hifzi: pageStudentHifzi, incentive: pageStudentIncentive, attendance: pageStudentAttendance };
  const pageFn = pages[ui.studentTab] || pageStudentOverview;
  return `<div class="shell">
    <div class="sidebar">
      <div class="brand2"><div class="mark"><img src="${LOGO_URI}" alt="الشعار"></div><div><b>مركز الأقصى القرآني</b><span>صفحة الطالب</span></div></div>
      ${STUDENT_NAV.map(n=>`<button class="nav-item ${ui.studentTab===n.k?'active':''}" data-snav="${n.k}"><span class="ic">${n.ic}</span> ${n.label}</button>`).join('')}
      <div class="sidebar-foot"><button class="logout-btn" id="logout-btn">تسجيل الخروج</button></div>
    </div>
    <div class="main">${pageFn(s)}</div>
  </div>`;
}
function pageStudentOverview(s){
  const att = attendanceStats(s.id);
  const rec = recitationStats(s.id);
  const group = data.groups.find(g=>g.id===s.groupId);
  const ranking = groupRanking();
  const myRankIdx = group ? ranking.findIndex(g=>g.id===group.id) : -1;
  return `
      <div class="page-head"><h2>أهلًا، ${esc(s.name)}</h2><p>${esc(s.class||'')} ${group?' • مجموعة '+esc(group.name):''}</p></div>
      <div class="grid-cards">
        <div class="stat-card accent"><div class="label">نسبة الحضور</div><div class="value">${att.pct}%</div><div class="sub">${att.present} حضور من ${att.total} يوم مسجّل</div>${progressBarHtml(att.pct)}</div>
        <div class="stat-card"><div class="label">غياب بعذر</div><div class="value">${att.excused}</div></div>
        <div class="stat-card"><div class="label">غياب بدون عذر</div><div class="value">${att.unexcused}</div></div>
        <div class="stat-card"><div class="label">صفحات مُنجزة</div><div class="value">${rec.completed}/${TOTAL_PAGES}</div></div>
      </div>
      ${group? `<div class="card">
        <h3>مجموعتي في الحافز</h3>
        <div class="group-card"><div class="ghead">
          <div style="display:flex;align-items:center;gap:10px;"><div class="rank-badge ${myRankIdx===0?'first':''}">${myRankIdx+1}</div><div class="gname">${esc(group.name)}</div></div>
          <div class="pill pill-gold">${ranking[myRankIdx]?.pts??0} نقطة</div>
        </div>
        <p style="margin:6px 0 0;font-size:12.5px;color:#8a7f5c;">ترتيب مجموعتي: ${myRankIdx+1} من أصل ${ranking.length} مجموعة متنافسة — التفاصيل الكاملة بصفحة «الحافز»</p>
        </div>
      </div>` : ''}`;
}
function pageStudentIncentive(s){
  const group = data.groups.find(g=>g.id===s.groupId);
  const ranking = groupRanking();
  const myRankIdx = group ? ranking.findIndex(g=>g.id===group.id) : -1;
  const cd = competitionCountdown();
  let cdHtml = '';
  if(cd.state==='running') cdHtml = `<div class="stat-card accent"><div class="label">الوقت المتبقي لنهاية الحافز</div><div class="value">${cd.days} يوم</div><div class="sub">تنتهي بتاريخ ${data.config.competitionEnd}</div></div>`;
  else if(cd.state==='not-started') cdHtml = `<div class="stat-card"><div class="label">الحافز لم يبدأ بعد</div><div class="value" style="font-size:16px;">يبدأ ${cd.start}</div></div>`;
  else if(cd.state==='ended') cdHtml = `<div class="stat-card"><div class="label">حالة الحافز</div><div class="value" style="font-size:16px;">انتهى الحافز</div></div>`;
  else cdHtml = `<div class="stat-card"><div class="label">فترة الحافز</div><div class="value" style="font-size:15px;">لم تُحدَّد بعد</div></div>`;
  return `
      <div class="page-head"><h2>الحافز</h2><p>مجموعتي وترتيبها بين المجموعات المتنافسة</p></div>
      <div class="grid-cards">${cdHtml}</div>
      <div class="card">
        <h3>مجموعتي في الحافز</h3>
        ${group? `
          <div class="group-card"><div class="ghead">
            <div style="display:flex;align-items:center;gap:10px;"><div class="rank-badge ${myRankIdx===0?'first':''}">${myRankIdx+1}</div><div class="gname">${esc(group.name)}</div></div>
            <div class="pill pill-gold">${ranking[myRankIdx]?.pts??0} نقطة</div>
          </div>
          <p style="margin:6px 0 0;font-size:12.5px;color:#8a7f5c;">ترتيب مجموعتي: ${myRankIdx+1} من أصل ${ranking.length} مجموعة متنافسة</p>
          <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);">
            <div style="font-size:12.5px;font-weight:800;color:var(--teal-800);margin-bottom:6px;">نقاط أعضاء المجموعة</div>
            ${(()=>{ const members = data.students.filter(m=>m.groupId===group.id).map(m=>({name:m.name,pts:studentPoints(m.id),isMe:m.id===s.id})).sort((a,b)=>b.pts-a.pts);
              return members.length? members.map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 2px;font-size:12.5px;${m.isMe?'font-weight:800;color:var(--teal-800);':'color:#6b6142;'}">
                <span>${esc(m.name)}${m.isMe?' <span style="font-size:11px;color:#a8895a;">(أنا)</span>':''}</span>
                <span class="pill pill-gray">${m.pts} نقطة</span>
              </div>`).join('') : `<div style="font-size:12px;color:#a89a6b;">لا يوجد أعضاء بعد</div>`;
            })()}
          </div>
          ${group.bonusLog && group.bonusLog.length? `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);">
            <div style="font-size:12.5px;font-weight:800;color:var(--teal-800);margin-bottom:6px;">نقاط إضافية من المشرف</div>
            ${group.bonusLog.slice().reverse().map(l=>`<div style="font-size:12px;color:#8a7f5c;padding:3px 0;">
              <span class="pill ${l.amount>0?'pill-green':'pill-red'}">${l.amount>0?'+':''}${l.amount} نقطة</span>
              ${l.note?` — ${esc(l.note)}`:' — بدون سبب مذكور'}
              <span style="color:#c2b78a;">(${l.date})</span>
            </div>`).join('')}
          </div>` : ''}
          ` : `<div class="empty">لم يتم ضمّك إلى مجموعة بعد</div>`}
      </div>
      <div class="card">
        <h3>المجموعات المتنافسة</h3>
        ${ranking.length? ranking.map((g,i)=>`
          <div class="group-card" style="${group&&g.id===group.id?'border-color:var(--gold);':''}"><div class="ghead">
            <div style="display:flex;align-items:center;gap:10px;"><div class="rank-badge ${i===0?'first':''}">${i+1}</div><div class="gname">${esc(g.name)}${group&&g.id===group.id?' <span style=\"font-size:11px;color:#a8895a;\">(مجموعتي)</span>':''}</div></div>
            <div class="pill pill-gold">${g.pts} نقطة</div>
          </div></div>`).join('') : `<div class="empty">لا توجد مجموعات بعد</div>`}
      </div>`;
}
function pageStudentAttendance(s){
  const dates = classAttendanceDates();
  if(!dates.length){
    return `<div class="page-head"><h2>الحضور والغياب</h2></div><div class="card"><div class="empty">لم يتم تحديد فترة الفصل وأيام الدوام بعد</div></div>`;
  }
  const att = attendanceStats(s.id);
  if(!ui.studentAttDate || !dates.includes(ui.studentAttDate)) ui.studentAttDate = dates.includes(todayStr()) ? todayStr() : dates[0];
  const myAtt = data.attendance[s.id] || {};
  const dayChips = dates.map(d=>{
    const v = myAtt[d];
    const cls = v==='present'?'done':v==='excused'||v==='unexcused'?'partial':'';
    return `<div class="day-chip ${d===ui.studentAttDate?'sel':''} ${cls}" data-sdate="${d}">${dayChipLabel(d)}</div>`;
  }).join('');
  const status = myAtt[ui.studentAttDate];
  const statusHtml = status==='present' ? `<span class="pill pill-green">حاضر</span>`
    : status==='excused' ? `<span class="pill pill-gold">غياب بعذر</span>`
    : status==='unexcused' ? `<span class="pill pill-red">غياب بدون عذر</span>`
    : `<span class="pill pill-gray">لم يُسجَّل بعد</span>`;
  return `
      <div class="page-head"><h2>الحضور والغياب</h2><p>سجل حضورك التفصيلي — للمشاهدة فقط</p></div>
      <div class="grid-cards">
        <div class="stat-card accent"><div class="label">نسبة الحضور</div><div class="value">${att.pct}%</div><div class="sub">${att.present} حضور من ${att.total} يوم مسجّل</div>${progressBarHtml(att.pct)}</div>
        <div class="stat-card"><div class="label">غياب بعذر</div><div class="value">${att.excused}</div></div>
        <div class="stat-card"><div class="label">غياب بدون عذر</div><div class="value">${att.unexcused}</div></div>
      </div>
      <div class="card">
        <h3>أيام الدوام ضمن فترة الفصل</h3>
        <div class="days-scroll">${dayChips}</div>
        <div class="legend" style="margin-top:10px;">
          <span><i style="background:var(--teal-500);border-radius:50%;"></i> حاضر</span>
          <span><i style="background:var(--gold);border-radius:50%;"></i> غياب (بعذر أو بدون)</span>
          <span><i style="background:var(--line);border-radius:50%;"></i> لم يُسجَّل بعد</span>
        </div>
      </div>
      <div class="card">
        <h3>حالتي يوم: ${dayChipLabel(ui.studentAttDate)}</h3>
        <div>${statusHtml}</div>
      </div>`;
}
function pageStudentHifzi(s){
  let cells = '';
  for(let p=1;p<=TOTAL_PAGES;p++){
    const g = (data.recitation[s.id]||{})[p];
    const cls = g==='ممتاز'?'g3':g==='جيد جدا'?'g2':g==='جيد'?'g1':g==='مسمع من قبل'?'g0':'';
    cells += `<div class="qpage ${cls}" title="صفحة ${p}${g?' — '+g:''}">${p}</div>`;
  }
  const rec = recitationStats(s.id);
  const newCount = newMemorizationCount(s.id);
  return `
      <div class="page-head"><h2>حفظي</h2><p>604 صفحة — للمشاهدة فقط</p></div>
      <div class="grid-cards">
        <div class="stat-card"><div class="label">صفحات مُنجزة</div><div class="value">${rec.completed}/${TOTAL_PAGES}</div></div>
        <div class="stat-card accent"><div class="label">صفحات منجزة هذا الفصل</div><div class="value">${newCount}</div><div class="sub">تقييم جيد أو جيد جدًا أو ممتاز</div></div>
      </div>
      <div class="card">
        <h3>سجل الحفظ (604 صفحة)</h3>
        <div class="quran-grid">${cells}</div>
        <div class="legend">
          <span><i style="background:var(--teal-700)"></i> ممتاز</span>
          <span><i style="background:#4fa896"></i> جيد جدًا</span>
          <span><i style="background:var(--gold)"></i> جيد</span>
          <span><i style="background:#8a7d54"></i> مسمّع من قبل</span>
          <span><i style="background:#fff;border:1.5px solid var(--line)"></i> لم يُسمّع بعد</span>
        </div>
      </div>`;
}
function bindStudent(){
  document.getElementById('logout-btn').onclick = logout;
  document.querySelectorAll('[data-snav]').forEach(b=>b.onclick=()=>{ ui.studentTab=b.dataset.snav; render(); });
  document.querySelectorAll('[data-sdate]').forEach(el=>el.onclick=()=>{
    ui.studentAttDate = el.dataset.sdate; render();
  });
}

loadData();
</script>
</body>
</html>
